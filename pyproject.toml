[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explaintrust"
version = "0.1.0"
description = "Evaluate the trustworthiness of post-hoc explanations (SHAP, LIME)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lvcheer" }]
keywords = ["explainable-ai", "xai", "shap", "lime", "interpretability", "faithfulness"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "lime>=0.2",
    "tqdm>=4.0",
]

[project.optional-dependencies]
# Interactive demo / article figures
app = ["streamlit>=1.45", "plotly>=5.0", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
include = ["explaintrust*"]
