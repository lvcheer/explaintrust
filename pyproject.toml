[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explaintrust"
version = "0.1.0"
description = "Evaluate the trustworthiness of post-hoc explanations (SHAP, LIME)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lvcheer" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["explainable-ai", "xai", "shap", "lime", "interpretability", "faithfulness"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "lime>=0.2",
    "tqdm>=4.0",
]

[project.optional-dependencies]
# Interactive demo / article figures
app = ["streamlit>=1.45", "plotly>=5.0", "matplotlib>=3.6"]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/lvcheer/explaintrust"
Repository = "https://github.com/lvcheer/explaintrust"
"Issue Tracker" = "https://github.com/lvcheer/explaintrust/issues"

[tool.setuptools.packages.find]
include = ["explaintrust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
