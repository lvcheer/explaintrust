[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "explaintrust"
version = "0.1.0"
description = "Diagnostic metrics for tabular SHAP and LIME explanations."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lvcheer" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["explainable-ai", "xai", "shap", "lime", "interpretability", "faithfulness"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "shap>=0.44",
    "lime>=0.2",
    "tqdm>=4.0",
]

[project.optional-dependencies]
# Interactive demo / article figures
app = ["streamlit>=1.45", "plotly>=5.0", "matplotlib>=3.6"]
test = ["pytest>=8.0"]
release = ["build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/lvcheer/explaintrust"
Repository = "https://github.com/lvcheer/explaintrust"
"Issue Tracker" = "https://github.com/lvcheer/explaintrust/issues"
Changelog = "https://github.com/lvcheer/explaintrust/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["explaintrust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
