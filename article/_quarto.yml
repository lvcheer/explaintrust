project:
  type: website
  output-dir: _site

website:
  title: "explaintrust"
  page-navigation: true
  repo-url: https://github.com/lvcheer/explaintrust
  repo-actions: [edit, source]
  navbar:
    left:
      - href: index.qmd
        text: Project and guide
    right:
      - icon: github
        href: https://github.com/lvcheer/explaintrust
        aria-label: GitHub

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    css: styles.css
    code-fold: true
    code-tools: true
    page-layout: full
    include-in-header:
      text: |
        <meta name="description" content="explaintrust tests the faithfulness, stability, and reproducibility of tabular SHAP and LIME explanations.">
        <meta property="og:title" content="explaintrust">
        <meta property="og:type" content="website">

execute:
  freeze: auto
